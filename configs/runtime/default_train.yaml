# Shared training runtime parameters

batch_sizes:
  train: 8
  valid: 8
  test: 8
  draw: 6

microbatch_sizes:
  vae:
    train: 8
    valid: 8
    draw: 6
  diffusion:
    train: 8
    valid: 8
    test: 1
    draw: 6
  fgseg:
    train: 4
    valid: 4
    test: 4
    draw: 4

optimization:
  learning_rate: 1.0e-4
  min_learning_rate: 1.0e-6
  adam_betas: [0.9, 0.999]
  ema_decay: 0.995
  scheduler_patience: 3
  pretrained_scheduler_patience: 3

training_budget:
  max_epochs: 500
  max_iterations: 125000
  extra_model_save_epoch_num: [50, 100, 150, 200, 250, 300, 350, 400, 500]

hardware:
  num_workers: 4

draw:
  sampler: ddpm
  seed: 999
  interval_epochs: 5
  tif_interval_epochs: 25

logging:
  save_tif_images: true
