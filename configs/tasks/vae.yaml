vae:
  model:
    down_channels: [32, 64, 128]
    mid_inout_channels: [128, 128]
    num_down_layers: 1
    num_mid_layers: 1
    num_up_layers: 1
    z_channel: 8
    norm_channels: 8

  losses:
    kl_weight: 0.001

  preload:
    enabled: false
    source_dataset: main
    source_path: "VAE/VAE_Models_SaveFolder/main/VAE_main.pth"
