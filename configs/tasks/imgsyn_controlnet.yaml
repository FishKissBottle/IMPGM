# =============================================================================
# ImgSyn ControlNet Task Configuration
# =============================================================================

diffusion:
  unet:
    ch: 96
    ch_mult: [1, 2, 3, 4]
    attn_resolutions: [8, 16, 32, 64]
    dropout: 0.0
    resamp_with_conv: true
    resolution: 64
    in_channels: 8
    out_channels: 8

  scheduler:
    type: cosine
    cosine:
      min_beta: 1.0e-4
      max_beta: 0.999
      offset: 0.008
    linear:
      min_beta: 1.0e-4
      max_beta: 0.01
    power:
      min_beta: 1.0e-4
      max_beta: 0.999
      exponent: 3
    sigmoid:
      min_beta: 1.0e-4
      max_beta: 0.999
      start: -12.0
      end: -2.0

  sampling:
    steps: 1000

  losses:
    edge_weight: 100.0

controlnet:
  conditional_channels: 4
  weight: 1.0
  background_highpass_filter_scale: 0.20
  preload:
    enabled: false
    source_dataset: main
    source_path: "ImgSyn/ImgSyn_ControlNet_Models_SaveFolder/main/ImgSyn_ControlNet_main_cosine.pth"
    skip_prefix: "prompt_embd_attn"
